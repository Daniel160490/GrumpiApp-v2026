<main class="premium-layout">
  <nav class="top-bar">
    <button class="pill-btn btn-back" routerLink="/guia">◀ Volver</button>
  </nav>

  <article class="content-card">
    <div class="legend-container">
        <h1>Leyenda de cartas Grumpi</h1>

        <div class="legend-wrapper">
        <div class="card-preview">
            <div class="card-header">
                <span class="type-icon">🍃</span>
                <span class="card-title">003 - BUGELION</span>
            </div>
            <div class="card-body">
                <div class="health-badge">150</div>
                <div class="card-image-placeholder">GRUMPI</div>

            <div class="card-footer">
                <div class="attack-row">
                    <span class="attack-icon">🍃</span>
                    <span class="attack-name">Reflejo</span>
                    <span class="attack-damage">50</span>
                </div>
                <div class="attack-row">
                    <span class="attack-icon">🍃</span>
                    <span class="attack-name">Tajo espora</span>
                    <span class="attack-damage">50</span>

                </div>
                <div class="status-effect">👁️</div>
            </div>
        </div>

        <div class="pointer label-type">Tipo de energía</div>
        <div class="pointer label-name">Nombre del Grumpy</div>
        <div class="pointer label-health">Salud</div>
        <div class="pointer label-status">Estado alterado</div>
        <div class="pointer label-attack">Ataques</div>
        <div class="pointer label-energy">Energía necesaria</div>
        <div class="pointer label-damage">Daño</div>
        <div class="pointer label-desc">Descripción</div>
        </div>
    </div>

  </article>

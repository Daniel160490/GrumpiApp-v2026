<main class="premium-layout">
  
  <nav class="top-bar">
    <button class="pill-btn btn-back" routerLink="/profile">◀ {{ "BACK" | translate }}</button>
    <h1 class="page-title">{{ "BAG.TITLE" | translate }}</h1>
    <div class="spacer"></div>
  </nav>

  <!-- EL NUEVO NAV DE CATEGORÍAS -->
  <nav class="category-nav">
    <button [class.active]="categoriaSeleccionada() === 'todos'" (click)="cambiarCategoria('todos')">✨ Todos</button>
    <button [class.active]="categoriaSeleccionada() === 'objetos'" (click)="cambiarCategoria('objetos')">🎒 Objetos</button>
    <button [class.active]="categoriaSeleccionada() === 'grumpis'" (click)="cambiarCategoria('grumpis')">👾 Grumpis</button>
    <button [class.active]="categoriaSeleccionada() === 'mejoras'" (click)="cambiarCategoria('mejoras')">⚡ Mejoras</button>
  </nav>

  <section class="bag-grid">
    <div class="bag-card" *ngFor="let item of objetosFiltrados">
      <div class="item-image">
        <img [src]="item.imagen" [alt]="item.nombre" (contextmenu)="disableRightClick($event)" />
      </div>
      <div class="item-info">
        <h3 class="item-name">{{ item.nombre }}</h3>
        <p class="item-desc">{{ item.descripcion }}</p>
        <span class="item-quantity">x{{ item.cantidad }}</span>
      </div>
    </div>
    
    <div *ngIf="objetosFiltrados.length === 0" class="empty-bag">
      <p>🎒 Tu mochila está vacía. ¡Juega para conseguir objetos!</p>
    </div>
  </section>

</main>
